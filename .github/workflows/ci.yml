name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa tesseract-ocr-cat tesseract-ocr-eng poppler-utils

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check src tests tools

      - name: Check formatting with black
        run: uv run black --check src tests tools

      - name: Check import sorting with isort
        run: uv run isort --check --profile=black src tests tools

      - name: Run tests
        env:
          # Avoid accidental real API calls in CI
          OPENAI_API_KEY: "sk-test-dummy-key"
        run: |
          uv run pytest -q
