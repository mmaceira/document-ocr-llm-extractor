[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-llm-extractor"
version = "0.1.0"
description = "Docling OCR + LLM-based structured document extraction + PNG/PDF visualization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "docling>=1.16.1",
  "openai>=1.35.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.0.0",
  "pillow>=10.0.0",
  "python-dotenv>=1.0.1",
  "pymupdf>=1.24.0",
  "reportlab>=4.0.0",
  "pdf2image>=1.17.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
  "pytesseract>=0.3.10",
  "rapidocr-onnxruntime>=1.3.0",
  "numpy>=1.24.0",
  "pytest>=7.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "mypy>=1.0.0",
  "pre-commit>=3.0.0",
  "black>=24.0.0",
  "isort>=5.13.0",
]

[project.scripts]
document-llm-extractor = "document_llm_extractor.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/document_llm_extractor"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RET", "SIM"]


[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
[dependency-groups]
dev = [
    "commitizen>=4.10.0",
]
